version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 25  # Use your app's Node.js version
    commands:
      - npm install
  build:
    commands:
      - npm run build # If you have a build script
  post_build:
    commands:
      - echo "Build completed on `date`"
artifacts:
  files:
    - '**/*'
  discard-paths: no