version: 0.2

env:
  variables:
    NODE_ENV: production

phases:
  install:
    runtime-versions:
      nodejs: 18
      python: 3.11
    commands:
      - echo "[INSTALL PHASE] Installing Python dependencies for backend..."
      - cd backend  # ✅ Now relative to project folder
      - pip install -r requirements.txt -t ../vendor
      - cd ..
      - echo "[INSTALL PHASE] Installing Node.js dependencies for frontend..."
      - cd frontend # ✅ Now relative to project folder
      - npm ci
      - cd ..

  build:
    commands:
      - echo "[BUILD PHASE] Building React frontend..."
      - cd frontend
      - npm run build
      - cd ..
      - echo "[BUILD PHASE] Preparing final deployment package..."
      - mkdir -p staged
      # Copy backend Python files (from project folder's backend)
      - cp -r backend/* staged/
      - rm -rf staged/__pycache__
      # Copy the built React files
      - mkdir -p staged/static
      - cp -r frontend/build/* staged/static/
      # Copy Elastic Beanstalk configs (from project folder root)
      - cp -r .ebextensions staged/
      - cp Procfile staged/

  post_build:
    commands:
      - echo "[POST_BUILD] Creating the final deployment ZIP archive..."
      - cd staged
      - zip -r ../application-$CODEBUILD_BUILD_NUMBER.zip .
      - cd ..
      - echo "[POST_BUILD] Build completed."

artifacts:
  files:
    - "application-*.zip"
  discard-paths: yes

cache:
  paths:
    - 'frontend/node_modules/**/*'